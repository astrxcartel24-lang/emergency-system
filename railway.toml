# railway.toml — deploy Karada backend to Railway.app
# Run: railway up  (from the repo root)

[build]
builder = "dockerfile"
dockerfilePath = "backend/incident-service/Dockerfile"
dockerContext = "backend/incident-service"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"

[[services]]
name = "karada-incident-api"

[services.variables]
PORT = "8090"
